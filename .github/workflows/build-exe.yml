name: Build Windows EXE

on:
  push:
    branches: [master]
    paths:
      - "apps/windows/**"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json

      - name: Setup Rust (stable + static CRT for portable EXE)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows/src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app (portable EXE + NSIS installer)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: nasend-portable
          path: apps/windows/src-tauri/target/release/nas-share-desktop.exe

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: nasend-setup
          path: apps/windows/src-tauri/target/release/bundle/nsis/*.exe
