<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0e1117"/>
  <rect x="80" y="80" width="1040" height="470" fill="none" stroke="#30363d" stroke-width="1"/>
  
  <!-- Minimal wordmark mark -->
  <g transform="translate(140, 150)">
    <rect x="0" y="0" width="48" height="48" rx="4" fill="none" stroke="#f0f6fc" stroke-width="3"/>
    <circle cx="24" cy="24" r="6" fill="#f0f6fc"/>
    <text x="68" y="36" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="600" font-size="36" fill="#f0f6fc">Nasend</text>
  </g>

  <!-- Clean Editorial Headline -->
  <text x="140" y="290" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="600" font-size="52" fill="#f0f6fc" letter-spacing="-1">
    Files between your devices,
  </text>
  <text x="140" y="355" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="600" font-size="52" fill="#f0f6fc" letter-spacing="-1">
    without a server.
  </text>

  <!-- Factual subline -->
  <text x="140" y="425" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" fill="#8b949e">
    Direct peer-to-peer file transfers and local 4K streaming over LAN and WebRTC.
  </text>

  <!-- Technical specs footer line -->
  <line x1="140" y1="475" x2="1060" y2="475" stroke="#30363d" stroke-width="1"/>
  <text x="140" y="510" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16" fill="#8b949e">
    Port 8743 • Crockford Base32 • DTLS 1.3 • Ed25519 Pinning • Open Source (MIT)
  </text>
</svg>
